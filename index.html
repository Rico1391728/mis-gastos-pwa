<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b52"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Mis Gastos</title><style>:root{--g:#176b52;--mint:#e5f2ec;--ink:#19352c;--muted:#6d8179;--line:#dce8e2;--coral:#ef8a72}*{box-sizing:border-box}body{margin:0;background:#f6faf8;color:var(--ink);font:16px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:650px;margin:auto;padding:22px 16px 45px}.head{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:13px;color:var(--g);font-weight:800;letter-spacing:.06em}.title{font-size:30px;margin:4px 0}.sub{color:var(--muted);margin:0 0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px #173f2b0b}.hero{background:var(--g);color:#fff;border:0}.row{display:flex;justify-content:space-between;align-items:center}.big{font-size:30px;font-weight:800}.small{font-size:13px;opacity:.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfdfc;font:inherit;color:var(--ink)}.wide{grid-column:1/-1}button{border:0;border-radius:12px;padding:12px 14px;font:700 15px inherit;cursor:pointer}.add{background:#f4c95d;color:#4a3900;width:100%;margin-top:9px}.filters{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.filter{background:var(--mint);color:var(--g);white-space:nowrap}.filter.active{background:var(--g);color:#fff}.section{display:flex;justify-content:space-between;font-weight:800;margin:15px 2px 8px}.section span{font-size:13px;color:var(--muted)}.expense{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:12px 2px}.expense:last-child{border:0}.dot{width:12px;height:12px;border-radius:50%;background:var(--coral);flex:none}.info{flex:1;min-width:0}.name{font-weight:700}.meta{font-size:13px;color:var(--muted)}.amount{font-weight:800}.empty{text-align:center;color:var(--muted);padding:20px}.barrow{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px}.bar{height:10px;background:var(--mint);border-radius:8px;flex:1;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:8px}.danger{background:#fff0ee;color:#a34b43}.secondary{background:var(--mint);color:var(--g)}@media(max-width:460px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style><style>.app{max-width:720px;padding:18px 16px 52px}.head{position:sticky;top:0;z-index:2;background:#f6faf8;padding:8px 0 16px}.title{font-size:34px;letter-spacing:-.03em}.sub{font-size:15px}.card{border:0;box-shadow:0 10px 28px rgba(23,107,82,.09);padding:18px}.hero{background:linear-gradient(135deg,#176b52,#2a8d70);box-shadow:0 12px 30px rgba(23,107,82,.24)}.hero .big{font-size:34px}.input,select{background:#fff;min-height:48px}.add{min-height:50px;font-size:16px}.filters{padding-bottom:2px}.filter{border:1px solid #cfe2d8}.filter.active{box-shadow:0 5px 12px rgba(23,107,82,.18)}.expense{padding:14px 4px}.dot{width:14px;height:14px;box-shadow:0 0 0 5px #fff0ec}.name{font-size:16px}.amount{color:var(--g);font-size:16px}.barrow{padding:4px 0}.bar{height:12px}.bar i{background:linear-gradient(90deg,#176b52,#5bb58d)}.section{font-size:17px}.section span{font-weight:600}.danger{min-height:44px;margin-top:10px;width:100%}@media(max-width:460px){.title{font-size:30px}.card{border-radius:22px}.grid{gap:10px}}</style></head><body><main class="app"><header class="head"><div><div class="eyebrow">CONTROL DE TU DINERO</div><h1 class="title">Mis Gastos</h1><p class="sub">Registra hoy para decidir mejor mañana.</p></div><div style="font-size:34px">💰</div></header><section class="card hero"><div class="row"><div><div class="small">Total del período</div><div class="big" id="total">$0</div></div><div style="text-align:right"><div class="small">Gastos registrados</div><div class="big" id="number">0</div></div></div></section><section class="card"><div class="section">Fondos disponibles <span>configura tus saldos</span></div><div class="grid"><label style="font-size:13px;font-weight:700;color:var(--muted)">Efectivo<input id="cash" class="input" type="number" min="0" placeholder="$0" style="display:block;margin-top:5px"></label><label style="font-size:13px;font-weight:700;color:var(--muted)">Tarjeta<input id="cardbal" class="input" type="number" min="0" placeholder="$0" style="display:block;margin-top:5px"></label><label style="font-size:13px;font-weight:700;color:var(--muted)">Cooperativa<input id="coop" class="input" type="number" min="0" placeholder="$0" style="display:block;margin-top:5px"></label><label style="font-size:13px;font-weight:700;color:var(--muted)">Banco<input id="bank" class="input" type="number" min="0" placeholder="$0" style="display:block;margin-top:5px"></label></div><div id="wallet" class="meta" style="margin-top:10px"></div></section><section class="card"><div class="grid"><input id="desc" class="input wide" placeholder="¿En qué gastaste?" autocomplete="off"><input id="amount" class="input" type="number" min="0" step="0.01" placeholder="Monto"><input id="date" class="input" type="date"><select id="cat"><option>Alimentación</option><option>Transporte</option><option>Vivienda</option><option>Servicios</option><option>Salud</option><option>Educación</option><option>Deudas</option><option>Entretenimiento</option><option>Compras personales</option><option>Otros</option></select><select id="pay"><option>Efectivo</option><option>Tarjeta</option><option>Cooperativa</option><option>Banco</option></select><select id="kind"><option>Variable</option><option>Fijo</option></select><select id="need"><option>Necesario</option><option>Prescindible</option></select></div><button class="add" id="add">＋ Registrar gasto</button></section><div class="filters"><button class="filter active" data-f="all">Todos</button><button class="filter" data-f="today">Este período</button><button class="filter" data-f="need">Necesarios</button><button class="filter" data-f="want">Prescindibles</button></div><section class="card"><div class="section">Gastos registrados <span id="period"></span></div><div id="list"></div><button class="danger" id="clear">Borrar todos los gastos</button></section><section class="card"><div class="section">¿En qué se está yendo el dinero?</div><div id="breakdown"></div></section><section class="card"><div class="section">Reporte quincenal <span>días 5 y 20</span></div><div id="report" class="empty">Registra varios gastos para generar recomendaciones.</div></section></main><script>const $=s=>document.querySelector(s), today=new Date().toISOString().slice(0,10);$('#date').value=today;let data=JSON.parse(localStorage.getItem('mis-gastos')||'[]'),balances=JSON.parse(localStorage.getItem('mis-saldos')||'{"Efectivo":0,"Tarjeta":0,"Cooperativa":0,"Banco":0}'),filter='all';if(!localStorage.getItem('saldos-migrados-v2')){data.forEach(x=>{if(balances[x.pay]!==undefined)balances[x.pay]-=x.amount});localStorage.setItem('saldos-migrados-v2','1');localStorage.setItem('mis-saldos',JSON.stringify(balances))}['cash','cardbal','coop','bank'].forEach((id,i)=>$( '#'+id).value=Object.values(balances)[i]||'');const money=n=>'$'+Number(n||0).toLocaleString('es-DO',{maximumFractionDigits:2});function period(){let d=new Date(),start=new Date(d.getFullYear(),d.getMonth(),d.getDate()<=5?1:16);return data.filter(x=>new Date(x.date+'T12:00:00')>=start)}function render(){let p=period(),shown=filter==='today'?p:filter==='need'?p.filter(x=>x.need==='Necesario'):filter==='want'?p.filter(x=>x.need==='Prescindible'):p;let total=p.reduce((a,x)=>a+x.amount,0);$('#total').textContent=money(total);$('#number').textContent=p.length;$('#period').textContent=p.length?`${p[0]?.date||''} al ${today}`:'';$('#list').innerHTML=shown.length?shown.slice().reverse().map(x=>`<div class="expense"><i class="dot"></i><div class="info"><div class="name">${esc(x.desc)}</div><div class="meta">${x.date} · ${esc(x.cat)} · ${esc(x.pay)} · ${x.need}</div></div><div class="amount">${money(x.amount)}</div></div>`).join(''):'<div class="empty">No hay gastos en este filtro.</div>';let avail=Object.entries(balances).map(([k,v])=>`${k}: ${money(Number(v||0))}`).join(' · ');$('#wallet').textContent=avail||'Configura tus fondos arriba';let cats={};p.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+x.amount);let sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]),max=sorted[0]?.[1]||0;$('#breakdown').innerHTML=sorted.length?sorted.map(([k,v])=>`<div class="barrow"><span style="width:125px">${esc(k)}</span><div class="bar"><i style="width:${max?v/max*100:0}%"></i></div><b>${money(v)}</b></div>`).join(''):'<div class="empty">Aquí verás tus categorías principales.</div>';if(sorted.length){let [cat,val]=sorted[0],pres=p.filter(x=>x.need==='Prescindible').reduce((a,x)=>a+x.amount,0);$('#report').innerHTML=`La categoría con mayor gasto es <b>${esc(cat)}</b> con <b>${money(val)}</b>. ${pres?`Los gastos prescindibles suman <b>${money(pres)}</b>; revisarlos puede ayudarte a ahorrar.`:'Sigue registrando gastos para detectar oportunidades de ajuste.'}`} }function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function save(){localStorage.setItem('mis-gastos',JSON.stringify(data));render()}['cash','cardbal','coop','bank'].forEach((id,i)=>$('#'+id).oninput=()=>{balances[Object.keys(balances)[i]]=Number($('#'+id).value)||0;localStorage.setItem('mis-saldos',JSON.stringify(balances));render()});$('#add').onclick=()=>{let desc=$('#desc').value.trim(),amount=Number($('#amount').value);if(!desc||!amount)return;data.push({id:Date.now(),desc,amount,date:$('#date').value,cat:$('#cat').value,pay:$('#pay').value,kind:$('#kind').value,need:$('#need').value});balances[$('#pay').value]=(Number(balances[$('#pay').value])||0)-amount;localStorage.setItem('mis-saldos',JSON.stringify(balances));$('#desc').value='';$('#amount').value='';save();$('#desc').focus()};document.addEventListener('click',e=>{let f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===f));render()}});$('#clear').onclick=()=>{if(confirm('¿Borrar todos los gastos?')){data=[];save()}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
